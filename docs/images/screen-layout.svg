<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="12">
  <title id="t">TrapNote screen layout</title>
  <desc id="d">The toolbar is at the top; the folder tree, the filters and the video list are on the left; the player is in the middle; the judgement panel is on the right.</desc>
  <defs>
    <style>
      .btn { fill: #ffffff; stroke: #c9ced6; }
      .lbl { fill: #2b2f36; }
      .dim { fill: #6b7280; }
      .pane { fill: #ffffff; stroke: #d5d9df; }
      .num { fill: #d9480f; }
      .numt { fill: #ffffff; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .chk { fill: #ffffff; stroke: #9aa1ab; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="999" height="599" rx="8" fill="#f4f5f7" stroke="#b9bec7"/>

  <!-- toolbar -->
  <rect x="1" y="1" width="998" height="72" rx="8" fill="#ffffff"/>
  <line x1="1" y1="73" x2="999" y2="73" stroke="#d5d9df"/>
  <g font-size="11">
    <rect x="12" y="10" width="100" height="24" rx="4" fill="#3b5bdb"/>
    <text x="62" y="26" text-anchor="middle" fill="#ffffff">Open project</text>
    <rect class="btn" x="118" y="10" width="50" height="24" rx="4"/><text class="lbl" x="143" y="26" text-anchor="middle">Rescan</text>
    <rect class="btn" x="174" y="10" width="96" height="24" rx="4"/><text class="lbl" x="222" y="26" text-anchor="middle">Read Timelapse</text>
    <rect class="btn" x="276" y="10" width="64" height="24" rx="4"/><text class="lbl" x="308" y="26" text-anchor="middle">Read CSV</text>

    <rect class="btn" x="356" y="10" width="76" height="24" rx="4"/><text class="lbl" x="394" y="26" text-anchor="middle">Detect only</text>
    <rect class="btn" x="438" y="10" width="58" height="24" rx="4"/><text class="lbl" x="467" y="26" text-anchor="middle">Auto ID</text>
    <rect class="btn" x="502" y="10" width="70" height="24" rx="4"/><text class="lbl" x="537" y="26" text-anchor="middle">Agreement</text>
    <rect class="btn" x="578" y="10" width="58" height="24" rx="4"/><text class="lbl" x="607" y="26" text-anchor="middle">Retrain</text>
    <rect class="btn" x="642" y="10" width="98" height="24" rx="4"/><text class="lbl" x="691" y="26" text-anchor="middle">Archive convert</text>
    <rect class="btn" x="746" y="10" width="76" height="24" rx="4"/><text class="lbl" x="784" y="26" text-anchor="middle">Export CSV</text>
    <rect class="btn" x="828" y="10" width="114" height="24" rx="4"/><text class="lbl" x="885" y="26" text-anchor="middle">Collect judgements</text>

    <rect x="650" y="42" width="106" height="22" rx="11" fill="#eef0f3" stroke="#d5d9df"/><text class="dim" x="703" y="57" text-anchor="middle">Background jobs</text>
    <text class="dim" x="790" y="57" text-anchor="middle">v0.3.0</text>
    <rect class="btn" x="822" y="42" width="60" height="22" rx="4"/><text class="lbl" x="852" y="57" text-anchor="middle">Settings</text>
    <rect class="btn" x="888" y="42" width="46" height="22" rx="4"/><text class="lbl" x="911" y="57" text-anchor="middle">日本語</text>
    <rect x="940" y="42" width="46" height="22" rx="4" fill="#ffffff" stroke="#e03131"/><text x="963" y="57" text-anchor="middle" fill="#e03131">Quit</text>
  </g>

  <!-- left: folder tree -->
  <rect class="pane" x="1" y="74" width="232" height="525"/>
  <rect x="1" y="74" width="232" height="20" fill="#e7edff"/>
  <text class="lbl" x="14" y="88">▾ Site_2026</text><text class="dim" x="222" y="88" text-anchor="end">12/240</text>
  <text class="lbl" x="30" y="107">St01</text><text class="dim" x="222" y="107" text-anchor="end">12/80</text>
  <text class="lbl" x="30" y="124">St02</text><text class="dim" x="222" y="124" text-anchor="end">0/95</text>
  <text class="lbl" x="30" y="141">St03</text><text class="dim" x="222" y="141" text-anchor="end">0/65</text>
  <line x1="1" y1="152" x2="233" y2="152" stroke="#d5d9df"/>

  <!-- left: filters -->
  <g font-size="11">
    <rect class="btn" x="8" y="160" width="104" height="22" rx="4"/><text class="lbl" x="14" y="175">All stations ▾</text>
    <rect class="btn" x="118" y="160" width="104" height="22" rx="4"/><text class="lbl" x="124" y="175">All statuses ▾</text>
    <rect class="btn" x="8" y="188" width="104" height="22" rx="4"/><text class="lbl" x="14" y="203">All species ▾</text>
    <rect class="btn" x="118" y="188" width="104" height="22" rx="4"/><text class="lbl" x="124" y="203">Detection: all ▾</text>
    <rect class="btn" x="8" y="216" width="104" height="22" rx="4"/><text class="dim" x="14" y="231" font-size="10">Search name / note</text>
    <rect class="btn" x="118" y="216" width="104" height="22" rx="4"/><text class="lbl" x="124" y="231">Station, date ▾</text>
    <rect class="btn" x="8" y="244" width="92" height="22" rx="4"/><text class="lbl" x="54" y="259" text-anchor="middle">Advanced search</text>
    <rect class="btn" x="106" y="244" width="54" height="22" rx="4"/><text class="lbl" x="133" y="259" text-anchor="middle">Assignee</text>
    <rect class="btn" x="166" y="244" width="60" height="22" rx="4"/><text class="lbl" x="196" y="259" text-anchor="middle" font-size="10">Bulk confirm</text>
  </g>
  <line x1="1" y1="274" x2="233" y2="274" stroke="#d5d9df"/>
  <text class="dim" x="10" y="291" font-size="11">240 items　unverified 228　verified 12</text>

  <!-- left: list -->
  <g>
    <rect x="1" y="300" width="232" height="62" fill="#e7edff"/>
    <rect x="8" y="306" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="320" font-weight="700">IMG_0003.AVI</text>
    <rect x="174" y="308" width="52" height="16" rx="8" fill="#2f9e44"/><text x="200" y="320" text-anchor="middle" fill="#fff" font-size="10">Verified</text>
    <text class="dim" x="78" y="337" font-size="11">St01 · 2026/10/20 19:05</text>
    <text x="78" y="353" font-size="11" fill="#2f7d32">Sika Deer</text><text x="150" y="353" font-size="11" fill="#1c64d8">AI ✓</text>

    <rect x="8" y="368" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="382" font-weight="700">IMG_0004.AVI</text>
    <rect x="194" y="370" width="32" height="16" rx="8" fill="#1c7ed6"/><text x="210" y="382" text-anchor="middle" fill="#fff" font-size="10">AI</text>
    <text class="dim" x="78" y="399" font-size="11">St01 · 2026/10/21 02:41</text>
    <text x="78" y="415" font-size="11" fill="#1c64d8">AI Wild Boar</text>

    <rect x="8" y="430" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="444" font-weight="700">IMG_0005.AVI</text>
    <rect x="160" y="432" width="66" height="16" rx="8" fill="#868e96"/><text x="193" y="444" text-anchor="middle" fill="#fff" font-size="10">Unprocessed</text>
    <text class="dim" x="78" y="461" font-size="11">St01 · 2026/10/21 04:13</text>

    <rect x="8" y="492" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="506" font-weight="700">IMG_0006.AVI</text>
    <rect x="160" y="494" width="66" height="16" rx="8" fill="#868e96"/><text x="193" y="506" text-anchor="middle" fill="#fff" font-size="10">Unprocessed</text>
    <text class="dim" x="78" y="523" font-size="11">St01 · 2026/10/21 05:30</text>
    <line x1="1" y1="362" x2="233" y2="362" stroke="#eceef1"/><line x1="1" y1="424" x2="233" y2="424" stroke="#eceef1"/><line x1="1" y1="486" x2="233" y2="486" stroke="#eceef1"/><line x1="1" y1="548" x2="233" y2="548" stroke="#eceef1"/>
  </g>

  <!-- middle: player -->
  <rect x="234" y="74" width="466" height="462" fill="#1f2228"/>
  <text x="467" y="250" text-anchor="middle" fill="#8b93a1" font-size="15">The video (or still image) appears here</text>
  <rect x="388" y="300" width="170" height="120" fill="none" stroke="#40c057" stroke-width="2"/>
  <rect x="388" y="282" width="128" height="18" fill="#40c057"/><text x="394" y="295" fill="#0b2e13" font-size="11">animal 0.93 Wild Boar</text>
  <text x="467" y="446" text-anchor="middle" fill="#8b93a1" font-size="11">Detection boxes (green = animal, orange = person, blue = vehicle)</text>

  <!-- middle: playback controls -->
  <rect class="pane" x="234" y="536" width="466" height="63"/>
  <rect class="btn" x="244" y="544" width="26" height="22" rx="4"/><text class="lbl" x="257" y="559" text-anchor="middle">◀</text>
  <rect class="btn" x="274" y="544" width="26" height="22" rx="4"/><text class="lbl" x="287" y="559" text-anchor="middle">▶</text>
  <rect class="btn" x="304" y="544" width="26" height="22" rx="4"/><text class="lbl" x="317" y="559" text-anchor="middle">▶|</text>
  <line x1="344" y1="555" x2="500" y2="555" stroke="#aeb4bd" stroke-width="4" stroke-linecap="round"/><circle cx="410" cy="555" r="6" fill="#3b5bdb"/>
  <text class="dim" x="510" y="559">3.2 / 10.0</text>
  <text class="dim" x="578" y="559">½× 1× 2× 4×</text>
  <text class="dim" x="244" y="586">☑ Boxes　　No boost ▾　　Play on open ▾　　Edit boxes</text>

  <!-- right: judgement panel -->
  <rect class="pane" x="701" y="74" width="298" height="525"/>
  <text class="lbl" x="712" y="94" font-weight="700">IMG_0004.AVI</text>
  <text class="dim" x="986" y="94" text-anchor="end">2 / 240　🕓 🚫 ☆</text>
  <text class="dim" x="712" y="111" font-size="11">St01 · Site_2026 · 2026/10/21 02:41 · 10.0 s</text>

  <rect x="712" y="122" width="276" height="52" rx="4" fill="#eef4ff" stroke="#a5c0f0"/>
  <rect x="720" y="130" width="22" height="16" rx="3" fill="#1c64d8"/><text x="731" y="142" text-anchor="middle" fill="#fff" font-size="10">AI</text>
  <text class="lbl" x="748" y="143" font-weight="700">AI judgement</text>
  <text class="lbl" x="720" y="164">Wild Boar 88%　<tspan class="dim" font-size="11">Press Enter to confirm as is</tspan></text>

  <rect x="712" y="182" width="276" height="188" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <rect x="712" y="182" width="4" height="188" fill="#2f9e44"/>
  <rect x="722" y="190" width="42" height="16" rx="3" fill="#2f9e44"/><text x="743" y="202" text-anchor="middle" fill="#fff" font-size="10">Human</text>
  <text class="lbl" x="770" y="203" font-weight="700" font-size="10.5">Species (human judgement)</text>
  <text class="dim" x="980" y="203" text-anchor="end" font-size="9.5">+ Add　Other…</text>
  <g font-size="11">
    <rect x="724" y="216" width="12" height="12" rx="2" fill="#3b5bdb"/><text x="730" y="226" text-anchor="middle" fill="#fff" font-size="10">✓</text><text class="lbl" x="742" y="227">1 Wild Boar</text>
    <rect class="chk" x="856" y="216" width="12" height="12" rx="2"/><text class="lbl" x="874" y="227">2 Sika Deer</text>
    <rect class="chk" x="724" y="238" width="12" height="12" rx="2"/><text class="lbl" x="742" y="249">3 Reeves' Muntjac</text>
    <rect class="chk" x="856" y="238" width="12" height="12" rx="2"/><text class="lbl" x="874" y="249">4 Raccoon Dog</text>
    <rect class="chk" x="724" y="260" width="12" height="12" rx="2"/><text class="lbl" x="742" y="271" font-size="10">5 Masked Palm Civet</text>
    <rect class="chk" x="856" y="260" width="12" height="12" rx="2"/><text class="lbl" x="874" y="271">6 Japanese Badger</text>
    <rect class="chk" x="724" y="282" width="12" height="12" rx="2"/><text class="lbl" x="742" y="293" font-size="10">7 Japanese Macaque</text>
    <rect class="chk" x="856" y="282" width="12" height="12" rx="2"/><text class="lbl" x="874" y="293">8 Japanese Hare</text>
    <text class="dim" x="742" y="315">…</text>
    <line x1="722" y1="326" x2="980" y2="326" stroke="#d5d9df" stroke-dasharray="3 3"/>
    <text class="lbl" x="724" y="346">N Empty　H Human　V Vehicle　A Area</text>
    <text class="lbl" x="724" y="363">U Unknown</text>
  </g>

  <rect x="712" y="378" width="276" height="62" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text class="lbl" x="722" y="396" font-weight="700">Wild Boar</text><text class="dim" x="980" y="396" text-anchor="end" font-size="11">+ Field</text>
  <text class="lbl" x="722" y="418">Count</text><rect class="btn" x="766" y="405" width="40" height="18" rx="3"/><text class="lbl" x="786" y="418" text-anchor="middle">1</text>
  <text class="lbl" x="824" y="418">Sex</text><rect class="btn" x="850" y="405" width="72" height="18" rx="3"/><text class="lbl" x="856" y="418">Unknown ▾</text>
  <text class="dim" x="722" y="434" font-size="11">Behaviour　+ Add record</text>

  <rect x="712" y="448" width="276" height="54" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text class="lbl" x="722" y="466" font-weight="700">Note</text>
  <rect class="btn" x="722" y="473" width="256" height="22" rx="3"/>

  <rect x="712" y="512" width="150" height="26" rx="4" fill="#3b5bdb"/><text x="787" y="529" text-anchor="middle" fill="#fff" font-size="11">Confirm and next  Enter</text>
  <rect class="btn" x="868" y="512" width="56" height="26" rx="4"/><text class="lbl" x="896" y="529" text-anchor="middle">Clear</text>
  <rect class="btn" x="930" y="512" width="58" height="26" rx="4"/><text class="lbl" x="959" y="529" text-anchor="middle">Undo</text>
  <text class="dim" x="712" y="560" font-size="11">▸ Keyboard</text>

  <!-- numbers -->
  <g>
    <circle class="num" cx="346" cy="42" r="11"/><text class="numt" x="346" y="47">1</text>
    <circle class="num" cx="630" cy="53" r="11"/><text class="numt" x="630" y="58">2</text>
    <circle class="num" cx="160" cy="118" r="11"/><text class="numt" x="160" y="123">3</text>
    <circle class="num" cx="227" cy="188" r="11"/><text class="numt" x="227" y="193">4</text>
    <circle class="num" cx="216" cy="466" r="11"/><text class="numt" x="216" y="471">5</text>
    <circle class="num" cx="254" cy="96" r="11"/><text class="numt" x="254" y="101">6</text>
    <circle class="num" cx="680" cy="570" r="11"/><text class="numt" x="680" y="575">7</text>
    <circle class="num" cx="970" cy="148" r="11"/><text class="numt" x="970" y="153">8</text>
    <circle class="num" cx="968" cy="346" r="11"/><text class="numt" x="968" y="351">9</text>
  </g>
</svg>
