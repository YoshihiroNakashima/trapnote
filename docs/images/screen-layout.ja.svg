<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="12">
  <title id="t">TrapNote の画面の構成</title>
  <desc id="d">上にツールバー、左にフォルダの木・絞り込み・動画の一覧、中央に再生画面、右に判定の欄がある。</desc>
  <defs>
    <style>
      .btn { fill: #ffffff; stroke: #c9ced6; }
      .lbl { fill: #2b2f36; }
      .dim { fill: #6b7280; }
      .pane { fill: #ffffff; stroke: #d5d9df; }
      .num { fill: #d9480f; }
      .numt { fill: #ffffff; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .chk { fill: #ffffff; stroke: #9aa1ab; }
    </style>
  </defs>

  <!-- 窓 -->
  <rect x="0.5" y="0.5" width="999" height="599" rx="8" fill="#f4f5f7" stroke="#b9bec7"/>

  <!-- ツールバー -->
  <rect x="1" y="1" width="998" height="72" rx="8" fill="#ffffff"/>
  <line x1="1" y1="73" x2="999" y2="73" stroke="#d5d9df"/>
  <g>
    <rect x="12" y="10" width="112" height="24" rx="4" fill="#3b5bdb"/>
    <text x="68" y="26" text-anchor="middle" fill="#ffffff">プロジェクトを開く</text>
    <rect class="btn" x="130" y="10" width="42" height="24" rx="4"/><text class="lbl" x="151" y="26" text-anchor="middle">更新</text>
    <rect class="btn" x="178" y="10" width="100" height="24" rx="4"/><text class="lbl" x="228" y="26" text-anchor="middle">Timelapse を読む</text>
    <rect class="btn" x="284" y="10" width="70" height="24" rx="4"/><text class="lbl" x="319" y="26" text-anchor="middle">CSV を読む</text>

    <rect class="btn" x="372" y="10" width="62" height="24" rx="4"/><text class="lbl" x="403" y="26" text-anchor="middle">種の登録</text>
    <rect class="btn" x="440" y="10" width="62" height="24" rx="4"/><text class="lbl" x="471" y="26" text-anchor="middle">検出のみ</text>
    <rect class="btn" x="508" y="10" width="62" height="24" rx="4"/><text class="lbl" x="539" y="26" text-anchor="middle">自動判定</text>
    <rect class="btn" x="576" y="10" width="50" height="24" rx="4"/><text class="lbl" x="601" y="26" text-anchor="middle">一致率</text>
    <rect class="btn" x="632" y="10" width="62" height="24" rx="4"/><text class="lbl" x="663" y="26" text-anchor="middle">追加学習</text>
    <rect class="btn" x="700" y="10" width="96" height="24" rx="4"/><text class="lbl" x="748" y="26" text-anchor="middle">データの書き出し</text>
    <rect class="btn" x="802" y="10" width="98" height="24" rx="4"/><text class="lbl" x="851" y="26" text-anchor="middle">判定の持ち寄り</text>

    <rect x="700" y="42" width="78" height="22" rx="11" fill="#eef0f3" stroke="#d5d9df"/><text class="dim" x="739" y="57" text-anchor="middle">裏の処理</text>
    <text class="dim" x="816" y="57" text-anchor="middle">v0.3.0</text>
    <rect class="btn" x="850" y="42" width="44" height="22" rx="4"/><text class="lbl" x="872" y="57" text-anchor="middle">設定</text>
    <rect class="btn" x="900" y="42" width="34" height="22" rx="4"/><text class="lbl" x="917" y="57" text-anchor="middle">EN</text>
    <rect x="940" y="42" width="46" height="22" rx="4" fill="#ffffff" stroke="#e03131"/><text x="963" y="57" text-anchor="middle" fill="#e03131">終了</text>
  </g>

  <!-- 左: フォルダの木 -->
  <rect class="pane" x="1" y="74" width="232" height="525"/>
  <rect x="1" y="74" width="232" height="20" fill="#e7edff"/>
  <text class="lbl" x="14" y="88">▾ Site_2026</text><text class="dim" x="222" y="88" text-anchor="end">12/240</text>
  <text class="lbl" x="30" y="107">St01</text><text class="dim" x="222" y="107" text-anchor="end">12/80</text>
  <text class="lbl" x="30" y="124">St02</text><text class="dim" x="222" y="124" text-anchor="end">0/95</text>
  <text class="lbl" x="30" y="141">St03</text><text class="dim" x="222" y="141" text-anchor="end">0/65</text>
  <line x1="1" y1="152" x2="233" y2="152" stroke="#d5d9df"/>

  <!-- 左: 絞り込み -->
  <rect class="btn" x="8" y="160" width="104" height="22" rx="4"/><text class="lbl" x="14" y="175">すべての地点 ▾</text>
  <rect class="btn" x="118" y="160" width="104" height="22" rx="4"/><text class="lbl" x="124" y="175">すべての状態 ▾</text>
  <rect class="btn" x="8" y="188" width="104" height="22" rx="4"/><text class="lbl" x="14" y="203">すべての種 ▾</text>
  <rect class="btn" x="118" y="188" width="104" height="22" rx="4"/><text class="lbl" x="124" y="203">検出: 全部 ▾</text>
  <rect class="btn" x="8" y="216" width="104" height="22" rx="4"/><text class="dim" x="14" y="231">名前・メモで検索</text>
  <rect class="btn" x="118" y="216" width="104" height="22" rx="4"/><text class="lbl" x="124" y="231">地点・日時 ▾</text>
  <rect class="btn" x="8" y="244" width="78" height="22" rx="4"/><text class="lbl" x="47" y="259" text-anchor="middle">高度な検索</text>
  <rect class="btn" x="92" y="244" width="40" height="22" rx="4"/><text class="lbl" x="112" y="259" text-anchor="middle">担当</text>
  <rect class="btn" x="138" y="244" width="64" height="22" rx="4"/><text class="lbl" x="170" y="259" text-anchor="middle">一括確定</text>
  <line x1="1" y1="274" x2="233" y2="274" stroke="#d5d9df"/>
  <text class="dim" x="10" y="291">240 件　未確認 228　確認済み 12</text>

  <!-- 左: 一覧 -->
  <g>
    <rect x="1" y="300" width="232" height="62" fill="#e7edff"/>
    <rect x="8" y="306" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="320" font-weight="700">IMG_0003.AVI</text>
    <rect x="178" y="308" width="48" height="16" rx="8" fill="#2f9e44"/><text x="202" y="320" text-anchor="middle" fill="#fff" font-size="10">確認済み</text>
    <text class="dim" x="78" y="337" font-size="11">St01 · 2026/10/20 19:05</text>
    <text x="78" y="353" font-size="11" fill="#2f7d32">人 ニホンジカ</text><text x="150" y="353" font-size="11" fill="#1c64d8">AI ✓</text>

    <rect x="8" y="368" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="382" font-weight="700">IMG_0004.AVI</text>
    <rect x="182" y="370" width="44" height="16" rx="8" fill="#1c7ed6"/><text x="204" y="382" text-anchor="middle" fill="#fff" font-size="10">AI 判定</text>
    <text class="dim" x="78" y="399" font-size="11">St01 · 2026/10/21 02:41</text>
    <text x="78" y="415" font-size="11" fill="#1c64d8">AI イノシシ</text>

    <rect x="8" y="430" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="444" font-weight="700">IMG_0005.AVI</text>
    <rect x="182" y="432" width="44" height="16" rx="8" fill="#868e96"/><text x="204" y="444" text-anchor="middle" fill="#fff" font-size="10">未処理</text>
    <text class="dim" x="78" y="461" font-size="11">St01 · 2026/10/21 04:13</text>

    <rect x="8" y="492" width="62" height="50" rx="3" fill="#3d4450"/>
    <text class="lbl" x="78" y="506" font-weight="700">IMG_0006.AVI</text>
    <rect x="182" y="494" width="44" height="16" rx="8" fill="#868e96"/><text x="204" y="506" text-anchor="middle" fill="#fff" font-size="10">未処理</text>
    <text class="dim" x="78" y="523" font-size="11">St01 · 2026/10/21 05:30</text>
    <line x1="1" y1="362" x2="233" y2="362" stroke="#eceef1"/><line x1="1" y1="424" x2="233" y2="424" stroke="#eceef1"/><line x1="1" y1="486" x2="233" y2="486" stroke="#eceef1"/><line x1="1" y1="548" x2="233" y2="548" stroke="#eceef1"/>
  </g>

  <!-- 中央: 再生画面 -->
  <rect x="234" y="74" width="466" height="462" fill="#1f2228"/>
  <text x="467" y="250" text-anchor="middle" fill="#8b93a1" font-size="15">動画（静止画）がここに出る</text>
  <rect x="388" y="300" width="170" height="120" fill="none" stroke="#40c057" stroke-width="2"/>
  <rect x="388" y="282" width="108" height="18" fill="#40c057"/><text x="394" y="295" fill="#0b2e13" font-size="11">動物 0.93 イノシシ</text>
  <text x="467" y="446" text-anchor="middle" fill="#8b93a1" font-size="11">検出枠（緑 = 動物、橙 = 人、青 = 車）</text>

  <!-- 中央: 再生の操作 -->
  <rect class="pane" x="234" y="536" width="466" height="63"/>
  <rect class="btn" x="244" y="544" width="26" height="22" rx="4"/><text class="lbl" x="257" y="559" text-anchor="middle">◀</text>
  <rect class="btn" x="274" y="544" width="26" height="22" rx="4"/><text class="lbl" x="287" y="559" text-anchor="middle">▶</text>
  <rect class="btn" x="304" y="544" width="26" height="22" rx="4"/><text class="lbl" x="317" y="559" text-anchor="middle">▶|</text>
  <line x1="344" y1="555" x2="500" y2="555" stroke="#aeb4bd" stroke-width="4" stroke-linecap="round"/><circle cx="410" cy="555" r="6" fill="#3b5bdb"/>
  <text class="dim" x="510" y="559">3.2 / 10.0</text>
  <text class="dim" x="578" y="559">½× 1× 2× 4×</text>
  <text class="dim" x="244" y="586">☑ 検出枠　　補正なし ▾　　開いたら再生 ▾　　枠を編集</text>

  <!-- 右: 判定の欄 -->
  <rect class="pane" x="701" y="74" width="298" height="525"/>
  <text class="lbl" x="712" y="94" font-weight="700">IMG_0004.AVI</text>
  <text class="dim" x="986" y="94" text-anchor="end">2 / 240　🕓 🚫 ☆</text>
  <text class="dim" x="712" y="111" font-size="11">St01 · Site_2026 · 2026/10/21 02:41 · 10.0 s</text>

  <rect x="712" y="122" width="276" height="52" rx="4" fill="#eef4ff" stroke="#a5c0f0"/>
  <rect x="720" y="130" width="22" height="16" rx="3" fill="#1c64d8"/><text x="731" y="142" text-anchor="middle" fill="#fff" font-size="10">AI</text>
  <text class="lbl" x="748" y="143" font-weight="700">AI の判定</text>
  <text class="lbl" x="720" y="164">イノシシ 88%　<tspan class="dim" font-size="11">Enter でそのまま確定</tspan></text>

  <rect x="712" y="182" width="276" height="188" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <rect x="712" y="182" width="4" height="188" fill="#2f9e44"/>
  <rect x="722" y="190" width="22" height="16" rx="3" fill="#2f9e44"/><text x="733" y="202" text-anchor="middle" fill="#fff" font-size="10">人</text>
  <text class="lbl" x="750" y="203" font-weight="700">種（人の判定）</text>
  <text class="dim" x="980" y="203" text-anchor="end" font-size="11">＋ 登録　その他…</text>
  <g>
    <rect x="724" y="216" width="12" height="12" rx="2" fill="#3b5bdb"/><text x="730" y="226" text-anchor="middle" fill="#fff" font-size="10">✓</text><text class="lbl" x="742" y="227">1 イノシシ</text>
    <rect class="chk" x="856" y="216" width="12" height="12" rx="2"/><text class="lbl" x="874" y="227">2 ニホンジカ</text>
    <rect class="chk" x="724" y="238" width="12" height="12" rx="2"/><text class="lbl" x="742" y="249">3 キョン</text>
    <rect class="chk" x="856" y="238" width="12" height="12" rx="2"/><text class="lbl" x="874" y="249">4 タヌキ</text>
    <rect class="chk" x="724" y="260" width="12" height="12" rx="2"/><text class="lbl" x="742" y="271">5 ハクビシン</text>
    <rect class="chk" x="856" y="260" width="12" height="12" rx="2"/><text class="lbl" x="874" y="271">6 ニホンアナグマ</text>
    <rect class="chk" x="724" y="282" width="12" height="12" rx="2"/><text class="lbl" x="742" y="293">7 ニホンザル</text>
    <rect class="chk" x="856" y="282" width="12" height="12" rx="2"/><text class="lbl" x="874" y="293">8 ニホンノウサギ</text>
    <text class="dim" x="742" y="315">…</text>
    <line x1="722" y1="326" x2="980" y2="326" stroke="#d5d9df" stroke-dasharray="3 3"/>
    <text class="lbl" x="724" y="346">N 動物なし　H 人　V 車　A 有効範囲</text>
    <text class="lbl" x="724" y="363">U 不明</text>
  </g>

  <rect x="712" y="378" width="276" height="62" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text class="lbl" x="722" y="396" font-weight="700">イノシシ</text><text class="dim" x="980" y="396" text-anchor="end" font-size="11">＋ 項目</text>
  <text class="lbl" x="722" y="418">個体数</text><rect class="btn" x="766" y="405" width="40" height="18" rx="3"/><text class="lbl" x="786" y="418" text-anchor="middle">1</text>
  <text class="lbl" x="824" y="418">性別</text><rect class="btn" x="856" y="405" width="56" height="18" rx="3"/><text class="lbl" x="862" y="418">不明 ▾</text>
  <text class="dim" x="722" y="434" font-size="11">行動　＋ 記録を足す</text>

  <rect x="712" y="448" width="276" height="54" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text class="lbl" x="722" y="466" font-weight="700">メモ</text>
  <rect class="btn" x="722" y="473" width="256" height="22" rx="3"/>

  <rect x="712" y="512" width="126" height="26" rx="4" fill="#3b5bdb"/><text x="775" y="529" text-anchor="middle" fill="#fff">確定して次へ  Enter</text>
  <rect class="btn" x="844" y="512" width="72" height="26" rx="4"/><text class="lbl" x="880" y="529" text-anchor="middle">判定を消す</text>
  <rect class="btn" x="922" y="512" width="66" height="26" rx="4"/><text class="lbl" x="955" y="529" text-anchor="middle">取り消し</text>
  <text class="dim" x="712" y="560" font-size="11">▸ キー操作</text>

  <!-- 番号 -->
  <g>
    <circle class="num" cx="352" cy="42" r="11"/><text class="numt" x="352" y="47">1</text>
    <circle class="num" cx="680" cy="53" r="11"/><text class="numt" x="680" y="58">2</text>
    <circle class="num" cx="160" cy="118" r="11"/><text class="numt" x="160" y="123">3</text>
    <circle class="num" cx="214" cy="255" r="11"/><text class="numt" x="214" y="260">4</text>
    <circle class="num" cx="216" cy="466" r="11"/><text class="numt" x="216" y="471">5</text>
    <circle class="num" cx="254" cy="96" r="11"/><text class="numt" x="254" y="101">6</text>
    <circle class="num" cx="680" cy="570" r="11"/><text class="numt" x="680" y="575">7</text>
    <circle class="num" cx="970" cy="148" r="11"/><text class="numt" x="970" y="153">8</text>
    <circle class="num" cx="968" cy="346" r="11"/><text class="numt" x="968" y="351">9</text>
  </g>
</svg>
