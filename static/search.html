<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TrapNote — 高度な検索</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%233b5bdb%27/%3E%3Cpath d=%27M9 11h14v3h-5.5v9h-3v-9H9z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/search.css?v=__V__">
</head>
<body>
<header id="swTop">
  <div class="sw-head">
    <div class="sw-title"><b data-t="adv_title">高度な検索</b><span id="swProject" class="info"></span></div>
    <div id="swCount" class="sw-count"></div>
    <div class="sw-actions"><button id="swClear" data-t="adv_clear_all">条件をすべて外す</button><button id="swClose" data-t="close">閉じる</button></div>
  </div>
  <div id="swLink" class="sw-link"></div>
  <div class="sw-saved">
    <span class="lbl" data-t="adv_saved">保存した検索</span>
    <select id="svSel"></select>
    <button id="svLoad" class="small" data-t="adv_recall">呼び出す</button>
    <button id="svDel" class="small danger-outline" data-t="delete">削除</button>
    <span class="gap"></span>
    <input id="svName" type="text" maxlength="80" data-placeholder="adv_save_name" placeholder="検索の名前" spellcheck="false">
    <button id="svSave" class="small primary" data-t="adv_save">いまの条件を保存</button>
  </div>
  <div id="swChips" class="sw-chips"></div>
</header>
<main id="swMain"></main>
<div id="swBack" class="hidden"></div>
<div id="swModal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="/static/i18n.js?v=__V__"></script>
<script src="/static/i18n_search.js?v=__V__"></script>
<script src="/static/search_shared.js?v=__V__"></script>
<script src="/static/search.js?v=__V__"></script>
</body>
</html>
