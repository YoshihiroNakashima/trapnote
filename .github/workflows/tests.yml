# Runs the automated tests (pytest) on every push to main and on pull requests.
# The tests use stand-in models and small generated files, so they need neither a GPU
# nor the MegaDetector and SpeciesNet models. Only the packages below are installed.
name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the packages that the tests need
        run: python -m pip install aiohttp pillow numpy opencv-python-headless imageio-ffmpeg send2trash pytest
      # Some tests compare TrapNote's own reading of video headers with ffprobe. They are skipped without it.
      - name: Install FFmpeg (ffmpeg and ffprobe)
        run: choco install ffmpeg --no-progress -y
      # Two tests are left out here. They check that a new thread starts at normal disk priority,
      # but GitHub's Windows runners start jobs at low disk priority, so the check cannot hold on them.
      - name: Run the tests
        env:
          TRAPNOTE_DATA_DIR: ${{ runner.temp }}\trapnote-data
        run: >
          python -m pytest tests -q -rs
          --deselect tests/test_background_priority.py::test_background_thread_lowers_io_priority
          --deselect tests/test_background_priority.py::test_copy_many_lowers_only_while_viewing
